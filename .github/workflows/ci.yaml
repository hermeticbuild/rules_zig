name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

  # Allows you to call this workflow from another workflow
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        description: The BuildBuddy remote execution access token.
        required: false

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  # Cancel previous actions from the same PR: https://stackoverflow.com/a/72408109
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # matrix-prep-* steps generate JSON used to create a dynamic actions matrix.
  # Insanely complex for how simple this requirement is inspired from
  # https://stackoverflow.com/questions/65384420/how-to-make-a-github-action-matrix-element-conditional

  matrix-prep-bazelversion:
    # Prepares the 'bazelversion' axis of the test matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: versions_from_bazel_versions_bzl
        run: echo "bazelversions=$(.github/scripts/bazel_versions.py)" >> $GITHUB_OUTPUT
    outputs:
      # Will look like ["<version from .bazelversion>","<version from bazel_versions.bzl>"]
      bazelversions: ${{ steps.versions_from_bazel_versions_bzl.outputs.bazelversions }}

  matrix-prep-zigversion:
    # Prepares the 'zigversion' axis of the test matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: versions_from_zig_versions_json
        run: |
          # https://stackoverflow.com/a/75770668/841562 by tlwhitec
          # license https://creativecommons.org/licenses/by-sa/4.0/
          jq_semver_cmp='
            def opt(f):
                . as $in | try f catch $in;
            def semver_cmp:
                sub("\\+.*$"; "")
              | capture("^(?<v>[^-]+)(?:-(?<p>.*))?$") | [.v, .p // empty]
              | map(split(".") | map(opt(tonumber)))
              | .[1] |= (. // {});'
          # Test the latest patch in each minor release; keep older patches in the catalog.
          echo "zigversions=$(jq -c "$jq_semver_cmp"'keys|group_by(split(".")[:2])|map(max_by(semver_cmp))|sort_by(semver_cmp)|reverse' zig/private/versions.json)" >> $GITHUB_OUTPUT
    outputs:
      # Sorted in descending semver order.
      zigversions: ${{ steps.versions_from_zig_versions_json.outputs.zigversions }}

  test-bazel-versions:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    needs:
      - matrix-prep-bazelversion
      - matrix-prep-zigversion

    # Run bazel test in each workspace with each version of Bazel supported
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bazelVersion: ${{ fromJSON(needs.matrix-prep-bazelversion.outputs.bazelversions) }}
        zigVersion:
          - ${{ fromJSON(needs.matrix-prep-zigversion.outputs.zigversions)[0] }}
        folder:
          - "."
          - "e2e/workspace"
        targetPattern: ["//..."]
        tagFilters: ["-zig-docs"]

    # Configure a human readable name for each job
    name: Test ${{ matrix.targetPattern }} ${{ matrix.tagFilters }} in ${{ matrix.folder }} with Zig ${{ matrix.zigVersion }}, and Bazel ${{ matrix.bazelVersion }} on ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - uses: ./.github/actions/test
        with:
          os: ${{ matrix.os }}
          folder: ${{ matrix.folder }}
          bazelVersion: ${{ matrix.bazelVersion }}
          # Disable documentation generation for all but the first Bazel
          # version, by setting --no@rules_zig//docs:build_docs in
          # .bazelrc.user. The generated documentation can vary between Bazel
          # versions. For example, Bazel version 7 changed the documentation of
          # the implicit `repo_mapping` parameter to repository rules compared
          # to Bazel version 6.
          docsEnabled: ${{ matrix.bazelVersion == fromJSON(needs.matrix-prep-bazelversion.outputs.bazelversions)[0] }}
          zigVersion: ${{ matrix.zigVersion }}
          targetPattern: ${{ matrix.targetPattern }}
          tagFilters: ${{ matrix.tagFilters }}
          buildbuddyApiKey: ${{ secrets.BUILDBUDDY_API_KEY || '' }}

  test-zig-versions:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    needs:
      - matrix-prep-bazelversion
      - matrix-prep-zigversion

    # Run bazel test in each workspace with each version of Bazel supported
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bazelVersion:
          - ${{ fromJSON(needs.matrix-prep-bazelversion.outputs.bazelversions)[0] }}
        zigVersion: ${{ fromJSON(needs.matrix-prep-zigversion.outputs.zigversions) }}
        folder:
          - "."
          - "e2e/workspace"
        targetPattern: ["//..."]
        tagFilters: ["-zig-docs"]
        exclude:
          # This combination is already tested in test-bazel-versions
          - bazelVersion: ${{ fromJSON(needs.matrix-prep-bazelversion.outputs.bazelversions)[0] }}
            zigVersion: ${{ fromJSON(needs.matrix-prep-zigversion.outputs.zigversions)[0] }}

    # Configure a human readable name for each job
    name: Test ${{ matrix.targetPattern }} ${{ matrix.tagFilters }} in ${{ matrix.folder }} with Zig ${{ matrix.zigVersion }}, and Bazel ${{ matrix.bazelVersion }} on ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - uses: ./.github/actions/test
        with:
          os: ${{ matrix.os }}
          folder: ${{ matrix.folder }}
          bazelVersion: ${{ matrix.bazelVersion }}
          # Disable documentation generation for all but the first Bazel
          # version, by setting --no@rules_zig//docs:build_docs in
          # .bazelrc.user. The generated documentation can vary between Bazel
          # versions. For example, Bazel version 7 changed the documentation of
          # the implicit `repo_mapping` parameter to repository rules compared
          # to Bazel version 6.
          docsEnabled: ${{ matrix.bazelVersion == fromJSON(needs.matrix-prep-bazelversion.outputs.bazelversions)[0] }}
          zigVersion: ${{ matrix.zigVersion }}
          targetPattern: ${{ matrix.targetPattern }}
          tagFilters: ${{ matrix.tagFilters }}
          buildbuddyApiKey: ${{ secrets.BUILDBUDDY_API_KEY || '' }}

  # Minimal smoke test to verify that rules_zig builds and tests on Windows.
  # Not yet part of all_tests, so a failure does not block merging.
  test-windows:
    runs-on: windows-latest
    # gha_join_jobs in all_tests checks every job in the run, not only those in
    # its `needs`. With continue-on-error, a failing job is reported as
    # successful, so it doesn't fail all_tests. Remove once Windows is stable.
    continue-on-error: true

    needs:
      - matrix-prep-bazelversion
      - matrix-prep-zigversion

    name: Test //... with Zig ${{ fromJSON(needs.matrix-prep-zigversion.outputs.zigversions)[0] }}, and Bazel ${{ fromJSON(needs.matrix-prep-bazelversion.outputs.bazelversions)[0] }} on windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/test
        with:
          os: windows-latest
          folder: "."
          bazelVersion: ${{ fromJSON(needs.matrix-prep-bazelversion.outputs.bazelversions)[0] }}
          docsEnabled: false
          zigVersion: ${{ fromJSON(needs.matrix-prep-zigversion.outputs.zigversions)[0] }}
          targetPattern: "//..."
          tagFilters: ""
          # No remote cache or execution while bringing up Windows.
          remoteCache: false
          remoteExec: false
          bazelFlags: "--config=windows"
          buildbuddyApiKey: ${{ secrets.BUILDBUDDY_API_KEY || '' }}

  # Cross-compilation check. Every build host cross-builds the simple binary
  # for every target platform. Each binary is then run on a real machine of
  # its target platform. This covers all host x target permutations.
  # Not yet part of all_tests, so a failure does not block merging.
  cross-build:
    runs-on: ${{ matrix.host }}
    continue-on-error: true

    needs:
      - matrix-prep-bazelversion
      - matrix-prep-zigversion

    strategy:
      fail-fast: false
      matrix:
        host:
          - ubuntu-latest # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-15-intel # x86_64-macos
          - macos-latest # aarch64-macos
          - windows-latest # x86_64-windows
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows

    name: Cross-build for ${{ matrix.target }} on ${{ matrix.host }}

    steps:
      - uses: actions/checkout@v6

      - name: Build //zig/tests/simple-binary for ${{ matrix.target }}
        shell: bash
        env:
          USE_BAZEL_VERSION: ${{ fromJSON(needs.matrix-prep-bazelversion.outputs.bazelversions)[0] }}
          ZIG_VERSION: ${{ fromJSON(needs.matrix-prep-zigversion.outputs.zigversions)[0] }}
          TARGET: ${{ matrix.target }}
        run: |
          flags=(
            --platforms=//zig/tests/platforms:"$TARGET"
            --@zig_toolchains//:version="$ZIG_VERSION"
          )
          bazel build "${flags[@]}" //zig/tests/simple-binary:binary
          # The target must have exactly one output file. Copy it to a fixed
          # name so that the run job doesn't have to guess.
          # (No mapfile: macOS runners ship a bash where it's unavailable)
          outputs=$(bazel cquery "${flags[@]}" --output=files //zig/tests/simple-binary:binary)
          count=$(printf '%s\n' "$outputs" | grep -c . || true)
          if [[ "$count" -ne 1 ]]; then
            echo "::error::Expected exactly one output file, got $count: $outputs"
            exit 1
          fi
          name=binary
          [[ "$TARGET" == *-windows ]] && name=binary.exe
          mkdir -p dist
          cp -v "$outputs" "dist/$name"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: cross-binary-${{ matrix.target }}-from-${{ matrix.host }}
          path: dist/
          if-no-files-found: error

  cross-run:
    # Runs on the machine type matching each target platform.
    runs-on: ${{ matrix.runner }}
    continue-on-error: true

    needs:
      - cross-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: x86_64-macos
            runner: macos-15-intel
          - target: aarch64-macos
            runner: macos-latest
          - target: x86_64-windows
            runner: windows-latest

    name: Run binaries cross-built for ${{ matrix.target }} on ${{ matrix.runner }}

    steps:
      # Downloads the binaries built for this target on every build host, each
      # in its own sub-directory named after the artifact.
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-binary-${{ matrix.target }}-from-*
          path: dist

      - name: Run each binary and check its output
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          name=binary
          [[ "$TARGET" == *-windows ]] && name=binary.exe
          status=0
          for dir in dist/*/; do
            bin="$dir$name"
            if [[ ! -f "$bin" ]]; then
              echo "::error::Missing $bin"
              status=1
              continue
            fi
            chmod +x "$bin"
            echo "::group::$bin"
            if "$bin" | tee output.txt && grep -qx 'Hello World!' output.txt; then
              echo "OK: $dir"
            else
              echo "::error::FAILED: $dir"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # Zig documentation builds are separated to work around the following issue:
  # https://github.com/hermeticbuild/rules_zig/issues/273
  #test-zig-docs:
  #  # The type of runner that the job will run on
  #  runs-on: ${{ matrix.os }}

  #  needs:
  #    - matrix-prep-bazelversion
  #    - matrix-prep-zigversion

  #  # Run bazel test in each workspace with each version of Bazel supported
