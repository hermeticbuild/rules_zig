name: Cross-compilation

# Cross-compilation check. Every build host cross-builds the simple binary for
# every target platform. Each binary is then run on a real machine of its
# target platform. This covers all host x target permutations.
# Called from ci.yaml so that the jobs are grouped under one caller job.
on:
  workflow_call:
    inputs:
      bazelVersion:
        description: The Bazel version to build with.
        type: string
        required: true
      zigVersion:
        description: The Zig version to build with.
        type: string
        required: true

jobs:
  cross-build:
    runs-on: ${{ matrix.host }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        host:
          - ubuntu-latest # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-latest # aarch64-macos
          - windows-latest # x86_64-windows
          - windows-11-arm # aarch64-windows
        target:
          - x86_64-linux
          - aarch64-linux
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows

    name: Cross-build for ${{ matrix.target }} on ${{ matrix.host }}

    steps:
      - uses: actions/checkout@v6

      - name: Build //zig/tests/simple-binary for ${{ matrix.target }}
        shell: bash
        env:
          USE_BAZEL_VERSION: ${{ inputs.bazelVersion }}
          ZIG_VERSION: ${{ inputs.zigVersion }}
          TARGET: ${{ matrix.target }}
        run: |
          flags=(
            --platforms=//zig/tests/platforms:"$TARGET"
            --@zig_toolchains//:version="$ZIG_VERSION"
          )
          bazel build "${flags[@]}" //zig/tests/simple-binary:binary
          # The target must have exactly one output file. Copy it to a fixed
          # name so that the run job doesn't have to guess.
          # (No mapfile: macOS runners ship a bash where it's unavailable)
          outputs=$(bazel cquery "${flags[@]}" --output=files //zig/tests/simple-binary:binary)
          count=$(printf '%s\n' "$outputs" | grep -c . || true)
          if [[ "$count" -ne 1 ]]; then
            echo "::error::Expected exactly one output file, got $count: $outputs"
            exit 1
          fi
          name=binary
          [[ "$TARGET" == *-windows ]] && name=binary.exe
          mkdir -p dist
          cp -v "$outputs" "dist/$name"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: cross-binary-${{ matrix.target }}-from-${{ matrix.host }}
          path: dist/
          if-no-files-found: error

  cross-run:
    # Runs on the machine type matching each target platform.
    runs-on: ${{ matrix.runner }}
    continue-on-error: true

    needs:
      - cross-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: aarch64-macos
            runner: macos-latest
          - target: x86_64-windows
            runner: windows-latest
          - target: aarch64-windows
            runner: windows-11-arm

    name: Run binaries cross-built for ${{ matrix.target }} on ${{ matrix.runner }}

    steps:
      # Downloads the binaries built for this target on every build host, each
      # in its own sub-directory named after the artifact.
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-binary-${{ matrix.target }}-from-*
          path: dist

      - name: Run each binary and check its output
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          name=binary
          [[ "$TARGET" == *-windows ]] && name=binary.exe
          status=0
          for dir in dist/*/; do
            bin="$dir$name"
            if [[ ! -f "$bin" ]]; then
              echo "::error::Missing $bin"
              status=1
              continue
            fi
            chmod +x "$bin"
            echo "::group::$bin"
            if "$bin" | tee output.txt && grep -qx 'Hello World!' output.txt; then
              echo "OK: $dir"
            else
              echo "::error::FAILED: $dir"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
